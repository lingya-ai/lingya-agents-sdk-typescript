name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          path: lingya-agents-sdk-typescript
      - uses: actions/checkout@v6
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: v0.1.3
          path: lingya-agents-openapi
      - uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install OIDC-capable npm CLI
        run: npm install --global npm@12.0.2 --registry=https://registry.npmmirror.com
      - name: Verify release tag
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"
        working-directory: lingya-agents-sdk-typescript
      - name: Install dependencies from domestic mirror
        run: npm ci --registry=https://registry.npmmirror.com
        working-directory: lingya-agents-sdk-typescript
      - name: Verify package
        run: npm run check
        working-directory: lingya-agents-sdk-typescript
      - name: Publish through npm trusted publishing
        run: node scripts/publish-if-needed.mjs
        working-directory: lingya-agents-sdk-typescript
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        working-directory: lingya-agents-sdk-typescript
