name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          path: lingya-agents-sdk-typescript
      - uses: actions/checkout@v6
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: v0.1.4
          path: lingya-agents-openapi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lingya-agents-sdk-typescript/package-lock.json
      - run: npm ci --registry=https://registry.npmmirror.com
        working-directory: lingya-agents-sdk-typescript
      - run: npm run check
        working-directory: lingya-agents-sdk-typescript
      - name: Verify generated bound API is committed
        run: git diff --exit-code -- src/bound.ts
        working-directory: lingya-agents-sdk-typescript
