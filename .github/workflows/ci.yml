name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          path: lingya-agents-sdk-typescript
      - uses: actions/checkout@v5
        with:
          repository: lingya-ai/lingya-agents-openapi
          ref: 7362df0fe127f9bab06cf018e086fd2fe4132327
          path: lingya-agents-openapi
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: lingya-agents-sdk-typescript/package-lock.json
      - run: npm ci --registry=https://registry.npmmirror.com
        working-directory: lingya-agents-sdk-typescript
      - run: npm run check
        working-directory: lingya-agents-sdk-typescript
      - run: npm pack --dry-run
        working-directory: lingya-agents-sdk-typescript
